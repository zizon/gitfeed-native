# Temporary diagnostic: does the Actions cron scheduler fire for this account?
name: cron-probe
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: echo "cron probe fired at $(date -u +%Y-%m-%dT%H:%MZ)"
