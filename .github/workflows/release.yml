name: release

# A tag publishes that version. A manual run builds and checks the tarball
# without publishing unless `publish` is ticked.
#
# The repository is private today, so this publishes without `--provenance`:
# npm attestation requires the source repository to be public. Once it is
# public, add `id-token: write` to `permissions` and `--provenance` to the
# publish command — or configure the package on npmjs.com as a trusted
# publisher and drop NPM_TOKEN entirely.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this version to npm
        type: boolean
        default: false

permissions:
  contents: write
  # Minted only when this workflow publishes without a token: the trusted
  # publisher configured on the package asks GitHub who is running.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # `secrets` cannot appear in an `if:` conditional, so its presence is
      # mapped here: with a token the publish steps use it, without one they
      # fall back to the trusted publisher.
      HAS_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: install
        run: pnpm install --frozen-lockfile

      # The tag is the version that reaches the registry, so the two must agree
      # before anything is built.
      - name: the tag names this version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $tag does not match package.json version $version"
            exit 1
          fi

      - name: gates
        run: pnpm test

      # `prepare` builds lib/ before packing, and pack also proves the file list
      # the registry would receive.
      - name: pack
        run: |
          npm pack --dry-run
          npm pack
      - uses: actions/upload-artifact@v7
        with:
          name: tarball
          path: '*.tgz'

      # Trusted publishing needs npm 11.5.1 or newer; the bundled one may be
      # older.
      - name: npm for a tokenless publish
        if: (startsWith(github.ref, 'refs/tags/v') || inputs.publish) && env.HAS_TOKEN != 'true'
        run: npm install -g npm@latest

      - name: publish with the token
        if: (startsWith(github.ref, 'refs/tags/v') || inputs.publish) && env.HAS_TOKEN == 'true'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: publish through the trusted publisher
        if: (startsWith(github.ref, 'refs/tags/v') || inputs.publish) && env.HAS_TOKEN != 'true'
        run: npm publish --access public

      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" ./*.tgz --generate-notes
